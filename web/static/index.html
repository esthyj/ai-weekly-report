<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오렌지픽 — AI 기반 주간 리포트 자동 생성 프로그램</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    /* ── 랜딩(A) 화면 전용 레이아웃 ───────────────────────── */
    body { background: #FFECDD; }
    .corner-logo {
      position: fixed;
      top: 6px;
      left: 27px;
      width: min(171px, 28.5vw);
      height: auto;
      z-index: 10;
    }
    .landing {
      font-family: "Pretendard Variable", Pretendard, var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 46px 23px 68px;
      gap: 27px;
    }
    .landing-brand {
      font-size: 42px;
      font-weight: 700;
      color: var(--text);        /* 진한 갈색/검정 계열 */
      letter-spacing: -0.5px;
      margin: 34px 0 0;          /* 조금 더 아래로 */
      min-height: 1.3em;          /* 타이핑 전 레이아웃 흔들림 방지 */
    }
    @keyframes blink { 50% { opacity: 0; } }
    .landing-tagline {
      font-size: 20px;
      color: #5a2d0c;            /* 진한 갈색 */
      margin: -13px 0 4px;
      min-height: 1.4em;          /* 타이핑 전 레이아웃 흔들림 방지 */
    }
    .landing-tagline .caret {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -0.12em;
      background: var(--text-muted);
      animation: blink 0.8s steps(1) infinite;
    }
    /* 정중앙 일러스트 + 우상단 로봇 겹침 배치 */
    .hero {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    .hero-woman {
      width: min(600px, 85.5vw);
      height: auto;
      display: block;
    }
    .hero-robot {
      position: absolute;
      top: -11%;
      right: -14%;
      width: min(242px, 42.75vw);
      height: auto;
      animation: float 3.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    a.primary.cta {
      font-size: 18px;
      padding: 14px 32px;
      border-radius: 999px;
      box-shadow: var(--shadow-md);
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    a.primary.cta:hover {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }
  </style>
</head>
<body>
  <img class="corner-logo" src="/images/Hanwha_Insurance_transparent.png" alt="한화손해보험 로고" />

  <main class="landing">
    <h1 class="landing-brand">오렌지픽! AI 기반 주간 리포트 자동 생성 프로그램</h1>
    <p class="landing-tagline" id="landing-tagline" data-text="주간리포트 작성이 어려우시다고요? ‘오렌지픽’이 도와드릴게요!"></p>

    <div class="hero">
      <img class="hero-woman" src="/images/working_woman.png" alt="업무 중인 사람 일러스트" />
      <img class="hero-robot" src="/images/orange_robot_transparent.png" alt="오렌지 로봇" />
    </div>

    <a class="primary cta" href="/report.html">‘오렌지픽’ 바로 체험하기</a>
  </main>

  <script>
    // 제목 타자(타이핑) 효과 — 한 글자씩 출력 후 깜빡이는 커서 유지
    (function () {
      var el = document.getElementById("landing-tagline");
      var text = el.getAttribute("data-text");
      var START = 1000;   // 페이지 로드 후 시작 지연(ms)
      var STEP = 40;     // 글자 간 등장 간격(ms)
      var caret = document.createElement("span");
      caret.className = "caret";
      el.appendChild(caret);
      var i = 0;
      function type() {
        if (i < text.length) {
          caret.insertAdjacentText("beforebegin", text.charAt(i));
          i++;
          setTimeout(type, STEP);
        }
      }
      setTimeout(type, START);
    })();
  </script>
</body>
</html>
